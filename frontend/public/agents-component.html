<!-- Team Section Start -->
<div class="container-fluid py-5">
  <div class="container">
    <div
      class="text-center mx-auto mb-5 wow fadeInUp"
      data-wow-delay="0.1s"
      style="max-width: 600px"
    >
      <h1 class="mb-3">Property Agents</h1>
      <p>
        Our expert agents are dedicated to providing the best service to help
        you find your dream home.
      </p>
    </div>
    <div class="row g-4" id="agentContainer">
      <!-- Loading Spinner -->
      <div class="col-12 text-center py-5" id="agent-loader">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- Team Section End -->

<!-- Updated fetchAgents function with absolute path handling -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script>
  $(document).ready(function () {
    const API_BASE = "http://localhost:5000"; // Backend URL

    async function fetchAgents() {
      try {
        // Backend theke data fetch kora
        const response = await fetch(`${API_BASE}/agents`);
        const result = await response.json();

        const container = $("#agentContainer");
        container.empty();

        if (result.success && result.data) {
          result.data.forEach((agent) => {
            let imageUrl = agent.image;

            if (imageUrl) {
              // Jodi path-er shurute "/" thake, tobe API_BASE er por separator lagbe na
              // Apnar database e "/admin/uploads/..." thakle eta thikmoto kaj korbe
              if (!imageUrl.startsWith("http")) {
                imageUrl = `${API_BASE}${imageUrl}`;
              }
            } else {
              imageUrl = "img/team-1.jpg"; // Default placeholder
            }

            container.append(`
                        <div class="col-lg-3 col-md-6 wow fadeInUp" data-wow-delay="0.1s">
                            <div class="team-item rounded overflow-hidden shadow-sm">
                                <div class="position-relative">
                                    <img class="img-fluid" 
                                         src="${imageUrl}" 
                                         alt="${agent.name}"
                                         style="width: 100%; height: 300px; object-fit: cover;"
                                         onerror="this.src='img/team-1.jpg'">
                                    <div class="position-absolute start-50 top-100 translate-middle d-flex align-items-center">
                                        <a class="btn btn-square mx-1" href="${agent.facebook || "#"}"target="_blank" rel="noopener noreferrer"><i class="fab fa-facebook-f"></i></a>
                                        <a class="btn btn-square mx-1" href="${agent.twitter || "#"}"target="_blank" rel="noopener noreferrer"><i class="fab fa-twitter"></i></a>
                                        <a class="btn btn-square mx-1" href="${agent.instagram || "#"}"target="_blank" rel="noopener noreferrer"><i class="fab fa-instagram"></i></a>
                                    </div>
                                </div>
                                <div class="text-center p-4 mt-3">
                                    <h5 class="fw-bold mb-0">${agent.name}</h5>
                                    <small>${agent.designation || "Real Estate Agent"}</small>
                                </div>
                            </div>
                        </div>
                    `);
          });
        }
      } catch (err) {
        console.error("Error loading agents:", err);
        $("#agentContainer").html(
          '<p class="text-center text-danger">Agents load hote somossa hochhe.</p>',
        );
      }
    }

    // Call the function
    fetchAgents();
  });
</script>
