<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Real Estate HTML Template</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="" name="keywords" />
    <meta content="" name="description" />

    <!-- Favicon -->
    <link href="img/favicon.html" rel="icon" />

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com/" />
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&amp;family=Inter:wght@700;800&amp;display=swap"
      rel="stylesheet"
    />

    <!-- Icon Font Stylesheet -->
    <link
      href="js/ajax/libs/font-awesome/5.10.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="js/bootstrap-icons%401.4.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Libraries Stylesheet -->
    <link href="lib/animate/animate.min.css" rel="stylesheet" />
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet" />

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet" />

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet" />
  </head>

  <body>
    <div class="container-fluid bg-white p-0">
      <!-- Spinner Start -->
      <div
        id="spinner"
        class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center"
      >
        <div
          class="spinner-border text-primary"
          style="width: 3rem; height: 3rem"
          role="status"
        >
          <span class="sr-only">Loading...</span>
        </div>
      </div>
      <!-- Spinner End -->

      <!-- Navbar Start -->
      <div id="dynamic-navbar-placeholder"></div>
      <!-- Navbar End -->

      <!-- Header Start -->
      <div id="dynamic-header-placeholder"></div>
      <!-- Header End -->

      <!-- Search Start -->
      <div id="search-bar-placeholder"></div>
      <!-- Search End -->

      <!-- Contact Start -->
      <div class="container-fluid py-5">
        <div class="container">
          <div
            class="text-center mx-auto mb-5 wow fadeInUp"
            data-wow-delay="0.1s"
            style="max-width: 600px"
          >
            <h1 class="mb-3">Contact Us</h1>
            <p>
              Looking for the perfect property? Get in touch with us today. Our
              team is always ready to help you explore the best real estate
              opportunities and answer any questions you may have.
            </p>
          </div>
          <div class="row g-4">
            <div class="col-12">
              <div class="row gy-4">
                <div class="col-md-6 col-lg-4 wow fadeIn" data-wow-delay="0.1s">
                  <div class="bg-light rounded p-3">
                    <div
                      class="d-flex align-items-center bg-white rounded p-3"
                      style="border: 1px dashed rgba(0, 185, 142, 0.3)"
                    >
                      <div class="icon me-3" style="width: 45px; height: 45px">
                        <i class="fa fa-map-marker-alt text-primary"></i>
                      </div>
                      <span>40, Kemal Ataturk Ave, Banani, Dhaka-1213</span>
                    </div>
                  </div>
                </div>
                <div class="col-md-6 col-lg-4 wow fadeIn" data-wow-delay="0.3s">
                  <div class="bg-light rounded p-3">
                    <div
                      class="d-flex align-items-center bg-white rounded p-3"
                      style="border: 1px dashed rgba(0, 185, 142, 0.3)"
                    >
                      <div class="icon me-3" style="width: 45px; height: 45px">
                        <i class="fa fa-envelope-open text-primary"></i>
                      </div>
                      <span
                        ><a
                          href=" #"
                          class="__cf_email__"
                          data-cfemail="2841464e47684d50494558444d064b4745"
                          >[email&#160;protected]</a
                        ></span
                      >
                    </div>
                  </div>
                </div>
                <div class="col-md-6 col-lg-4 wow fadeIn" data-wow-delay="0.5s">
                  <div class="bg-light rounded p-3">
                    <div
                      class="d-flex align-items-center bg-white rounded p-3"
                      style="border: 1px dashed rgba(0, 185, 142, 0.3)"
                    >
                      <div class="icon me-3" style="width: 45px; height: 45px">
                        <i class="fa fa-phone-alt text-primary"></i>
                      </div>
                      <span>+88 01844 075 476</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-6 wow fadeInUp" data-wow-delay="0.1s">
              <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3479.576814921634!2d90.40253607512881!3d23.793568878640947!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3755c70e61869649%3A0x53b94eb84e8e03ad!2s40%20Kemal%20Ataturk%20Ave%2C%20Dhaka%201213!5e1!3m2!1sen!2sbd!4v1772959981696!5m2!1sen!2sbd"
                width="600"
                height="450"
                style="border: 0"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
              ></iframe>
            </div>
            <div class="col-md-6">
              <div class="wow fadeInUp" data-wow-delay="0.5s">
                <div class="contact-form">
                  <div id="alertMessage"></div>
                  <form id="contactForm" novalidate="novalidate">
                    <div class="row">
                      <div class="col-sm-6 control-group">
                        <div class="form-floating">
                          <input
                            type="text"
                            class="form-control py-2"
                            id="name"
                            placeholder="Your Name"
                            required="required"
                            data-validation-required-message="Please enter your name"
                          />
                          <label for="name">Your Name</label>
                        </div>
                        <p class="help-block text-danger"></p>
                      </div>
                      <div class="col-sm-6 control-group">
                        <div class="form-floating">
                          <input
                            type="email"
                            class="form-control py-2"
                            id="email"
                            placeholder="Your Email"
                            required="required"
                            data-validation-required-message="Please enter your email"
                          />
                          <label for="email">Your Email</label>
                        </div>
                        <p class="help-block text-danger"></p>
                      </div>
                      <div class="col-sm-6 control-group">
                        <div class="form-floating">
                          <input
                            type="text"
                            class="form-control py-2"
                            id="mobile"
                            placeholder="Mobile"
                            required="required"
                            data-validation-required-message="Please enter your mobile number"
                            pattern="^(?![-. ])[\d().+\- ]{6,14}\d$"
                            data-validation-pattern-message="Not a valid mobile number"
                          />
                          <label for="mobile">Mobile</label>
                        </div>
                        <p class="help-block text-danger"></p>
                      </div>
                      <div class="col-sm-6 control-group">
                        <div class="form-floating">
                          <input
                            type="text"
                            class="form-control py-2"
                            id="subject"
                            placeholder="Subject"
                            required="required"
                            data-validation-required-message="Please enter a subject"
                          />
                          <label for="subject">Subject</label>
                        </div>
                        <p class="help-block text-danger"></p>
                      </div>
                      <div class="col-12 control-group">
                        <div class="form-floating">
                          <textarea
                            style="height: 200px"
                            class="form-control"
                            id="message"
                            placeholder="Message"
                            required="required"
                            data-validation-required-message="Please enter your message"
                          ></textarea>
                          <label for="message">Leave a message here</label>
                        </div>
                        <p class="help-block text-danger"></p>
                      </div>
                      <div class="col-12 text-center">
                        <button
                          class="btn btn-primary py-3 w-100"
                          type="submit"
                          id="sendMessageButton"
                        >
                          <span>Send Message</span>
                          <div
                            class="d-none spinner-border spinner-border-sm text-light ms-3"
                            role="status"
                          ></div>
                        </button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- Contact End -->

      <!-- Footer Start -->
      <div id="dynamic-footer-placeholder"></div>
      <!-- Footer End -->

      <!-- Back to Top -->
      <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"
        ><i class="bi bi-arrow-up"></i
      ></a>
    </div>

    <!-- JavaScript Libraries -->
    <script data-cfasync="false" src="js/email-decode.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script
      src="js/bootstrap%405.0.0/dist/js/bootstrap.bundle.min.js"
      type="text/javascript"
    ></script>
    <script src="lib/wow/wow.min.js" type="text/javascript"></script>
    <script src="lib/easing/easing.min.js" type="text/javascript"></script>
    <script
      src="lib/waypoints/waypoints.min.js"
      type="text/javascript"
    ></script>
    <script src="lib/owlcarousel/owl.carousel.min.js"></script>

    <!-- Template Javascript -->
    <script src="js/main.js" type="text/javascript"></script>
    <script src="js/rocket-loader.min.js" data-cf-settings="49" defer></script>

    <script>
      document
        .getElementById("contactForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const btn = document.getElementById("sendMessageButton");
          const spinner = btn.querySelector(".spinner-border");

          // UI Update
          btn.disabled = true;
          spinner.classList.remove("d-none");

          const formData = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            mobile: document.getElementById("mobile").value,
            subject: document.getElementById("subject").value,
            message: document.getElementById("message").value,
          };

          try {
            const response = await fetch(
              "http://localhost:5000/contact/submit",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData),
              },
            );

            const result = await response.json();

            if (result.success) {
              alert("Thank you! Your message has been sent.");
              document.getElementById("contactForm").reset();
            } else {
              alert("Error: " + result.message);
            }
          } catch (error) {
            console.error("Error:", error);
            alert("Something went wrong!");
          } finally {
            btn.disabled = false;
            spinner.classList.add("d-none");
          }
        });

      $(function () {
        // External file load korbe
        $("#dynamic-navbar-placeholder").load("navbar-component.html");
        $("#dynamic-header-placeholder").load("header-component.html");
        $("#search-bar-placeholder").load("search-bar.html");
        $("#dynamic-footer-placeholder").load(
          "footer-component.html",
          function () {
            // Optional: Re-initialize WOW.js if the footer has animations
            if (typeof WOW === "function") {
              new WOW().init();
            }
          },
        );
      });
    </script>
  </body>
</html>
