<div class="container-xxl py-5">
  <div class="container">
    <div class="row g-0 gx-5 align-items-end">
      <div class="col-lg-6">
        <div class="text-start mx-auto mb-5">
          <h1 class="mb-3">Property Listing</h1>
          <p>
            Discover our latest properties managed with transparency and
            efficiency.
          </p>
        </div>
      </div>
      <div class="col-lg-6 text-start text-lg-end">
        <ul
          class="nav nav-pills d-inline-flex justify-content-end mb-5"
          id="featureCategoryTab"
        ></ul>
      </div>
    </div>

    <div class="tab-content">
      <div class="tab-pane fade show p-0 active">
        <div class="row g-4" id="propertyListContainer">
          <div class="col-12 text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const API_BASE = "http://localhost:5000";

  /**
   * window.loadProperties: Loads data based on category slug or search parameters.
   * This is accessible globally so the main page can call it.
   */
  window.loadProperties = async function (categorySlug = null) {
    const container = $("#propertyListContainer");

    // Show a loading spinner while fetching data
    container.html(
      '<div class="col-12 text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>',
    );

    try {
      const urlParams = new URLSearchParams(window.location.search);

      // 1. Resolve Slug to ID: Backend search expects an ID, so we convert the slug first
      if (categorySlug) {
        const catRes = await fetch(`${API_BASE}/category`);
        const cats = await catRes.json();
        // Adjust based on your controller returning results.rows directly or wrapped in .data
        const categoryList = Array.isArray(cats) ? cats : cats.data || [];
        const matched = categoryList.find((c) => c.slug === categorySlug);
        if (matched) {
          urlParams.set("category", matched.id);
        }
      }

      // 2. Determine Endpoint: Use /search if parameters exist, otherwise get all
      let finalUrl = urlParams.toString()
        ? `${API_BASE}/properties/search?${urlParams.toString()}`
        : `${API_BASE}/properties`;

      // 3. Parallel Fetching: Get categories, properties, and images at once for speed
      const [featRes, propRes, imgRes] = await Promise.all([
        fetch(`${API_BASE}/feature-category`),
        fetch(finalUrl),
        fetch(`${API_BASE}/property-images`),
      ]);

      const features = await featRes.json();
      const propData = await propRes.json();
      const imgData = await imgRes.json();

      // Normalize data structure from backend responses
      const properties = propData.data || propData || [];
      const images = imgData.data || imgData || [];
      const featureList = Array.isArray(features)
        ? features
        : features.data || [];

      // 4. Render UI Components
      renderFeatureTabs(featureList);
      renderProperties(properties, images);

      // 5. Initialize internal filtering for Tabs (For Sale, For Rent, etc.)
      setupFilterEvents(properties, images);
    } catch (error) {
      console.error("Critical Load Error:", error);
      container.html(
        '<div class="col-12 text-center py-5"><p class="text-danger">Failed to load properties. Please check your connection.</p></div>',
      );
    }
  };

  /**
   * Renders the Feature Category Tabs (e.g., All, Residential, Commercial)
   */
  function renderFeatureTabs(features) {
    let tabsHtml = `<li class="nav-item me-2"><a class="btn btn-outline-primary active" data-bs-toggle="pill" href="javascript:void(0)" data-filter="all">All</a></li>`;

    features.forEach((cat) => {
      tabsHtml += `
        <li class="nav-item me-2">
            <a class="btn btn-outline-primary" data-bs-toggle="pill" href="javascript:void(0)" data-filter="${cat.id}">
                ${cat.category_name}
            </a>
        </li>`;
    });
    $("#featureCategoryTab").html(tabsHtml);
  }

  /**
   * Renders Property Cards.
   * Fixes the $NaN issue by ensuring price is treated as a Number.
   */
  function renderProperties(properties, images) {
    const container = $("#propertyListContainer");
    if (!properties || properties.length === 0) {
      container.html(
        '<div class="col-12 text-center py-5"><h3>No properties found matching your criteria.</h3></div>',
      );
      return;
    }

    let html = "";
    properties.forEach((p) => {
      // Find the main image (image_type === 1)
      const activeImg = images.find(
        (img) =>
          Number(img.property_id) === Number(p.id) &&
          Number(img.image_type) === 1,
      );
      const imgPath = activeImg
        ? activeImg.image.startsWith("http")
          ? activeImg.image
          : `${API_BASE}${activeImg.image}`
        : "img/placeholder.jpg";

      // Safe Price Parsing: Prevents $NaN if data is missing or malformed
      const rawPrice = p.price
        ? p.price.toString().replace(/[^0-9.]/g, "")
        : "0";
      const formattedPrice = Number(rawPrice).toLocaleString("en-US");

      html += `
        <div class="col-lg-4 col-md-6 mb-4">
            <div class="property-item rounded border h-100 shadow-sm bg-white overflow-hidden">
                <div class="position-relative">
                    <a href="property-details.html?id=${p.id}">
                        <img class="img-fluid w-100" src="${imgPath}" alt="${p.property_title}" style="height:240px; object-fit:cover;">
                    </a>
                    <div class="bg-primary text-white position-absolute top-0 start-0 m-3 py-1 px-3 rounded">
                        ${p.category_name || "Listing"}
                    </div>
                </div>
                <div class="p-4">
                    <h5 class="text-primary mb-3">$${formattedPrice}</h5>
                    <a class="d-block h5 mb-2 text-dark text-decoration-none" href="property-details.html?id=${p.id}">
                        ${p.property_title}
                    </a>
                    <p><i class="fa fa-map-marker-alt text-primary me-2"></i>${p.location_name || "Location"}</p>
                </div>
                <div class="d-flex border-top text-secondary">
                    <small class="flex-fill text-center border-end py-2"><i class="fa fa-ruler-combined text-primary me-2"></i>${p.size || 0} Sqft</small>
                    <small class="flex-fill text-center border-end py-2"><i class="fa fa-bed text-primary me-2"></i>${p.bedrooms || 0} Bed</small>
                    <small class="flex-fill text-center py-2"><i class="fa fa-bath text-primary me-2"></i>${p.bathrooms || 0} Bath</small>
                </div>
            </div>
        </div>`;
    });
    container.html(html);
  }

  /**
   * Handles click events on Feature Tabs for internal filtering
   */
  function setupFilterEvents(properties, images) {
    $("#featureCategoryTab")
      .off("click")
      .on("click", "a", function () {
        const filterId = $(this).attr("data-filter");
        $("#featureCategoryTab a").removeClass("active");
        $(this).addClass("active");

        // Filter by the feture_category ID returned by your search controller
        const filtered =
          filterId === "all"
            ? properties
            : properties.filter(
                (p) =>
                  Number(p.feture_category) === Number(filterId) ||
                  Number(p.feture_category_id) === Number(filterId),
              );

        renderProperties(filtered, images);
      });
  }

  /**
   * Automatic execution if accessed directly without category slug in URL
   */
  $(document).ready(function () {
    if (
      $("#propertyListContainer").length &&
      !window.location.search.includes("category=")
    ) {
      window.loadProperties();
    }
  });
</script>
