<script>
  $(document).ready(function () {
    // Current page-er path khuje ber koro
    var currentPath = window.location.pathname.split("/").pop();

    // Jodi path khali thake (mane root domain), tobe index.html dhore nao
    if (currentPath === "") {
      currentPath = "index.html";
    }

    // Protiti nav-link check koro
    $(".navbar-nav .nav-link").each(function () {
      var href = $(this).attr("href");

      // Jodi href current path-er sathe match kore
      if (currentPath === href) {
        $(this).addClass("active");
      } else {
        $(this).removeClass("active");
      }
    });
  });
</script>
